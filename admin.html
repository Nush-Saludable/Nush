<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUTRILIFE · Administración</title>
<style>
body{font-family:Arial;margin:0;background:#f5f3ed;color:#263025}header{background:#40512f;color:#fff;padding:25px}main{max-width:1250px;margin:auto;padding:20px}.box{background:#fff;border-radius:15px;padding:20px;margin-bottom:20px;box-shadow:0 2px 12px #0000000a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input,select,textarea{padding:9px;width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}button{padding:10px 15px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.p{background:#40512f;color:#fff}.danger{background:#b33;color:#fff}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:middle}.thumb{width:55px;height:55px;object-fit:cover;border-radius:8px;background:#eee}.actions{display:flex;gap:8px;flex-wrap:wrap}.login{max-width:420px;margin:70px auto}.muted{color:#777;font-size:13px}.ok{color:#236b2a;font-weight:bold}.err{color:#a22;font-weight:bold}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><header><b style="font-size:25px;letter-spacing:3px">NUTRILIFE</b><br>Panel de administración</header><main id="app"></main>
<script>
const app=document.getElementById('app');let P=[],C={},pass='';
const money=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
function login(){app.innerHTML=`<div class="box login"><h2>Acceso administrador</h2><p class="muted">Ingresá la contraseña del panel.</p><input id="pw" type="password" placeholder="Contraseña"><br><br><button class="p" onclick="doLogin()">ENTRAR</button><p id="msg"></p></div>`;}
async function doLogin(){pass=pw.value;try{let r=await fetch('/api/admin/catalog',{headers:{'x-admin-password':pass}});if(!r.ok)throw 0;let d=await r.json();P=d.products;C=d.config;draw();}catch(e){msg.className='err';msg.textContent='Contraseña incorrecta.'}}
function draw(){app.innerHTML=`<div class="box"><h2>Configuración de precios</h2><div class="grid"><label>Margen general %<input id="margin" type="number" value="${C.margin??40}"></label><label>Packaging 100 g<input id="p100" type="number" value="${C.packaging?.[100]??0}"></label><label>Packaging 500 g<input id="p500" type="number" value="${C.packaging?.[500]??0}"></label><label>Packaging 1 kg<input id="p1000" type="number" value="${C.packaging?.[1000]??0}"></label></div><br><div class="actions"><button class="p" onclick="save()">💾 GUARDAR TODO</button><button onclick="sync()">🔄 ACTUALIZAR COSTOS DESDE MAYAH</button><button onclick="logout()">Salir</button></div><p id="status" class="muted"></p></div><div class="box"><h2>Productos</h2><p class="muted">Editá costo, margen, nombre, categoría, disponibilidad y foto. Si cargás una foto propia, queda guardada y tiene prioridad sobre la imagen de Mayah.</p><div class="scroll"><table><thead><tr><th>Foto</th><th>Producto</th><th>Categoría</th><th>Costo</th><th>Margen %</th><th>Disponible</th><th>Nueva foto</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;drawRows();}
function drawRows(){rows.innerHTML=P.map((p,i)=>`<tr><td>${p.image?`<img class="thumb" src="${p.image}">`:'—'}</td><td><input value="${esc(p.name)}" onchange="P[${i}].name=this.value"></td><td><input value="${esc(p.cat)}" onchange="P[${i}].cat=this.value"></td><td><input type="number" value="${p.cost??0}" onchange="P[${i}].cost=+this.value"></td><td><input style="width:80px" type="number" value="${p.margin??C.margin??40}" onchange="P[${i}].margin=+this.value"></td><td><input type="checkbox" ${p.available!==false?'checked':''} onchange="P[${i}].available=this.checked"></td><td><input type="file" accept="image/*" onchange="photo(event,${i})"></td></tr>`).join('')}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function photo(e,i){let f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024){alert('La foto debe pesar menos de 4 MB.');return}let r=new FileReader();r.onload=()=>{P[i].image=r.result;drawRows()};r.readAsDataURL(f)}
async function save(){C.margin=+margin.value;C.packaging={100:+p100.value,500:+p500.value,1000:+p1000.value};status.textContent='Guardando...';try{let r=await fetch('/api/admin/catalog',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-password':pass},body:JSON.stringify({products:P,config:C})});let j=await r.json();if(!r.ok)throw new Error(j.message);status.className='ok';status.textContent='✓ Guardado correctamente. Los cambios ya están disponibles en la tienda.'}catch(e){status.className='err';status.textContent='Error al guardar: '+e.message}}
async function sync(){status.className='muted';status.textContent='Consultando Mayah...';try{let r=await fetch('/api/admin/sync-mayah',{method:'POST',headers:{'x-admin-password':pass}});let j=await r.json();if(!r.ok)throw new Error(j.message);let d=await(await fetch('/api/admin/catalog',{headers:{'x-admin-password':pass}})).json();P=d.products;C=d.config;draw();status.className='ok';status.textContent='✓ Costos actualizados desde Mayah: '+j.changed+' productos.'}catch(e){status.className='err';status.textContent='No se pudo actualizar: '+e.message}}
function logout(){pass='';login()}login();
</script></body></html>
