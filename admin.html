<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUTRILIFE · Administración</title><style>body{font-family:Arial;margin:0;background:#f5f3ed;color:#263025}header{background:#40512f;color:#fff;padding:25px}main{max-width:1250px;margin:auto;padding:20px}.box{background:#fff;border-radius:15px;padding:20px;margin-bottom:20px;box-shadow:0 2px 12px #0000000a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input,select,textarea{padding:9px;width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}button{padding:10px 15px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.p{background:#40512f;color:#fff}.danger{background:#b33;color:#fff}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1250px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:middle}.thumb{width:55px;height:55px;object-fit:cover;border-radius:8px;background:#eee}.actions{display:flex;gap:8px;flex-wrap:wrap}.login{max-width:420px;margin:70px auto}.muted{color:#777;font-size:13px}.ok{color:#236b2a;font-weight:bold}.err{color:#a22;font-weight:bold}.newprod{background:#f7faf3;border:2px dashed #40512f;border-radius:12px;padding:15px}.newprod h3{margin-top:0}.promo-card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0;background:#fff}.promo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{font-size:12px;color:#777}.promo-thumb{width:90px;height:65px;object-fit:cover;border-radius:8px;background:#eee;display:block;margin-bottom:8px}.margin-head{font-size:12px;font-weight:bold;color:#40512f}.calc{font-size:12px;color:#555;margin-top:4px}@media(max-width:800px){.grid,.promo-grid{grid-template-columns:1fr 1fr}}</style></head><body><header><b style="font-size:25px;letter-spacing:3px">NUTRILIFE</b><br>Panel de administración</header><main id="app"></main><script>const app=document.getElementById('app');let P=[],C={},pass='';function login(){app.innerHTML='<div class="box login"><h2>Acceso administrador</h2><p class="muted">Ingresá la contraseña del panel.</p><input id="pw" type="password" placeholder="Contraseña"><br><br><button class="p" onclick="doLogin()">ENTRAR</button><p id="msg"></p></div>'}async function doLogin(){pass=pw.value;try{let r=await fetch('/api/admin/catalog',{headers:{'x-admin-password':pass}});if(!r.ok)throw 0;let d=await r.json();P=d.products;C=d.config||{};C.promotions=C.promotions||[];draw()}catch(e){msg.className='err';msg.textContent='Contraseña incorrecta.'}}function m(p,g){return Number(p['margin'+g]??p.margin??40)}function price(p,g){return Math.round(Number(p.cost||0)*g/1000*(1+m(p,g)/100))}function draw(){app.innerHTML=`<div class="box"><h2>💰 Precios por presentación</h2><p class="muted">El costo mayorista se toma por kilo. Definí el margen de ganancia de cada producto por separado para 100 g, 500 g y 1 kg. No se usa margen general ni costo de packaging.</p><div class="actions"><button class="p" onclick="save()">💾 GUARDAR TODO</button><button onclick="sync()">🔄 ACTUALIZAR COSTOS DESDE MAYAH</button><button onclick="logout()">Salir</button></div><p id="status" class="muted"></p></div><div class="box"><div class="newprod"><h3>➕ Agregar un producto nuevo</h3><p class="muted">Definí el margen que querés ganar en cada presentación.</p><div class="grid"><label>Código<input id="newcode" placeholder="Ej. 1501"></label><label>Producto<input id="newname" placeholder="Ej. Nueces Mariposa"></label><label>Categoría<input id="newcat" placeholder="Ej. Frutos Secos"></label><label>Costo por kg<input id="newcost" type="number"></label><label>Margen 100 g %<input id="newm100" type="number" value="40"></label><label>Margen 500 g %<input id="newm500" type="number" value="40"></label><label>Margen 1 kg %<input id="newm1000" type="number" value="40"></label><label>Descripción<input id="newdesc"></label><label>Foto<input id="newphoto" type="file" accept="image/*"></label><label>Disponible<select id="newavailable"><option value="true">Sí</option><option value="false">No</option></select></label></div><br><button class="p" onclick="addProduct()">➕ AGREGAR A LA LISTA</button><p id="addmsg" class="muted"></p></div></div><div class="box"><h2>🔥 Promociones</h2><p class="muted">Creá combos, descuentos o precios especiales. Las promos activas aparecerán automáticamente en la página principal.</p><div class="newprod"><div class="promo-grid"><label>Nombre de la promo<input id="pn" placeholder="Ej. Combo Energía"></label><label>Precio promo<input id="pp" type="number" placeholder="Ej. 6990"></label><label>Texto corto<input id="pd" placeholder="Ej. 3 productos para compartir"></label><label>Foto<input id="pi" type="file" accept="image/*"></label><label>Activa<select id="pa"><option value="true">Sí</option><option value="false">No</option></select></label><label>Etiqueta<input id="pt" placeholder="🔥 OFERTA"></label></div><br><button class="p" onclick="addPromo()">➕ AGREGAR PROMO</button><p id="promsg" class="muted"></p></div><div id="promolist"></div></div><div class="box"><h2>Productos</h2><p class="muted">Las fotos, nombres, categorías, costos y disponibilidad existentes se conservan. Solo se reemplaza el sistema de margen por márgenes independientes para cada presentación.</p><div class="scroll"><table><thead><tr><th>Foto</th><th>Producto</th><th>Categoría</th><th>Costo/kg</th><th>100 g<br><span class="margin-head">Margen % / Precio</span></th><th>500 g<br><span class="margin-head">Margen % / Precio</span></th><th>1 kg<br><span class="margin-head">Margen % / Precio</span></th><th>Disponible</th><th>Nueva foto</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;drawRows();drawPromos()}function drawRows(){rows.innerHTML=P.map((p,i)=>{let a=m(p,100),b=m(p,500),c=m(p,1000);return `<tr><td>${p.image?`<img class="thumb" src="${p.image}">`:'—'}</td><td><input value="${esc(p.name)}" onchange="P[${i}].name=this.value"></td><td><input value="${esc(p.cat)}" onchange="P[${i}].cat=this.value"></td><td><input type="number" value="${p.cost??0}" onchange="P[${i}].cost=+this.value;drawRows()"></td><td><input style="width:80px" type="number" value="${a}" onchange="P[${i}].margin100=+this.value;drawRows()"><div class="calc">$${price(p,100).toLocaleString('es-AR')}</div></td><td><input style="width:80px" type="number" value="${b}" onchange="P[${i}].margin500=+this.value;drawRows()"><div class="calc">$${price(p,500).toLocaleString('es-AR')}</div></td><td><input style="width:80px" type="number" value="${c}" onchange="P[${i}].margin1000=+this.value;drawRows()"><div class="calc">$${price(p,1000).toLocaleString('es-AR')}</div></td><td><input type="checkbox" ${p.available!==false?'checked':''} onchange="P[${i}].available=this.checked"></td><td><input type="file" accept="image/*" onchange="photo(event,${i})"></td></tr>`}).join('')}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function photo(e,i){let f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024)return alert('La foto debe pesar menos de 4 MB.');let r=new FileReader();r.onload=()=>{P[i].image=r.result;drawRows()};r.readAsDataURL(f)}function addProduct(){const name=newname.value.trim(),cat=newcat.value.trim(),cost=Number(newcost.value),m100=Number(newm100.value||40),m500=Number(newm500.value||40),m1000=Number(newm1000.value||40),code=newcode.value.trim()||('LOCAL-'+Date.now());if(!name)return addmsg.textContent='Escribí el nombre.';if(cost<0)return addmsg.textContent='Costo inválido.';if(P.some(p=>String(p.code)===String(code)))return addmsg.textContent='Ese código ya existe.';const f=newphoto.files[0],finish=image=>{P.push({code,name,cat:cat||'Otros',cost,margin:m100,margin100:m100,margin500:m500,margin1000:m1000,desc:newdesc.value.trim(),available:newavailable.value==='true',image});drawRows();addmsg.className='ok';addmsg.textContent='✓ Agregado. Presioná GUARDAR TODO.'};if(f){if(f.size>4*1024*1024)return alert('La foto debe pesar menos de 4 MB.');let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(null)}function addPromo(){const name=pn.value.trim(),priceValue=Number(pp.value),desc=pd.value.trim(),tag=pt.value.trim()||'🔥 PROMO',active=pa.value==='true',f=pi.files[0];if(!name||!priceValue)return promsg.textContent='Completá nombre y precio.';if(f&&f.size>4*1024*1024)return alert('La foto debe pesar menos de 4 MB.');const finish=image=>{C.promotions.push({id:'PROMO-'+Date.now(),name,price:priceValue,desc,tag,active,image});pn.value='';pp.value='';pd.value='';pt.value='';pi.value='';drawPromos();promsg.className='ok';promsg.textContent='✓ Promo agregada. Presioná GUARDAR TODO.'};if(f){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(null)}function promoPhoto(e,i){let f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024)return alert('La foto debe pesar menos de 4 MB.');let r=new FileReader();r.onload=()=>{C.promotions[i].image=r.result;drawPromos()};r.readAsDataURL(f)}function drawPromos(){if(!promolist)return;promolist.innerHTML=C.promotions.map((p,i)=>`<div class="promo-card"><div class="grid"><label>Nombre<input value="${esc(p.name)}" onchange="C.promotions[${i}].name=this.value"></label><label>Precio<input type="number" value="${p.price}" onchange="C.promotions[${i}].price=+this.value"></label><label>Texto<input value="${esc(p.desc)}" onchange="C.promotions[${i}].desc=this.value"></label><label>Etiqueta<input value="${esc(p.tag)}" onchange="C.promotions[${i}].tag=this.value"></label><label>Activa<select onchange="C.promotions[${i}].active=this.value==='true'"><option value="true" ${p.active?'selected':''}>Sí</option><option value="false" ${!p.active?'selected':''}>No</option></select></label><label>Foto nueva<input type="file" accept="image/*" onchange="promoPhoto(event,${i})"></label></div>${p.image?`<img class="promo-thumb" src="${p.image}">`:'<p class="mini">Sin foto</p>'}<button class="danger" onclick="C.promotions.splice(${i},1);drawPromos()">Eliminar</button></div>`).join('')||'<p class="muted">Todavía no hay promociones.</p>'}async function save(){status.textContent='Guardando...';try{let r=await fetch('/api/admin/catalog',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-password':pass},body:JSON.stringify({products:P,config:C})});let j=await r.json();if(!r.ok)throw new Error(j.message);status.className='ok';status.textContent='✓ Guardado correctamente. Productos, fotos y promociones actualizados.'}catch(e){status.className='err';status.textContent='Error al guardar: '+e.message}}async function sync(){status.textContent='Consultando Mayah...';try{let r=await fetch('/api/admin/sync-mayah',{method:'POST',headers:{'x-admin-password':pass}});let j=await r.json();if(!r.ok)throw new Error(j.message);let d=await(await fetch('/api/admin/catalog',{headers:{'x-admin-password':pass}})).json();P=d.products;C=d.config||{};C.promotions=C.promotions||[];draw();status.className='ok';status.textContent='✓ Costos actualizados desde Mayah: '+j.changed+' productos.'}catch(e){status.className='err';status.textContent='No se pudo actualizar: '+e.message}}function logout(){pass='';login()}login();</script></body></html>
