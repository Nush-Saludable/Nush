<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NUTRILIFE · Administración</title>
<style>
body{font-family:Arial;margin:0;background:#f5f3ed;color:#263025}header{background:#40512f;color:#fff;padding:25px}main{max-width:1250px;margin:auto;padding:20px}.box{background:#fff;border-radius:15px;padding:20px;margin-bottom:20px;box-shadow:0 2px 12px #0000000a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input,select,textarea{padding:9px;width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}button{padding:10px 15px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.p{background:#40512f;color:#fff}.danger{background:#b33;color:#fff}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1250px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px;vertical-align:middle}.thumb{width:55px;height:55px;object-fit:cover;border-radius:8px;background:#eee}.actions{display:flex;gap:8px;flex-wrap:wrap}.login{max-width:420px;margin:70px auto}.muted{color:#777;font-size:13px}.ok{color:#236b2a;font-weight:bold}.err{color:#a22;font-weight:bold}.newprod{background:#f7faf3;border:2px dashed #40512f;border-radius:12px;padding:15px}.newprod h3{margin-top:0}.promo-card,.cat-card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0;background:#fff}.promo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{font-size:12px;color:#777}.promo-thumb,.cat-thumb{width:90px;height:65px;object-fit:cover;border-radius:8px;background:#eee;display:block;margin-bottom:8px}.margin-head{font-size:12px;font-weight:bold;color:#40512f}.calc{font-size:12px;color:#555;margin-top:4px}.save-ok{background:#e9f7ea;border:1px solid #8bc58f;color:#236b2a;padding:12px;border-radius:10px;margin-top:10px}.save-err{background:#fff0f0;border:1px solid #d99;color:#a22;padding:12px;border-radius:10px;margin-top:10px}.save-wait{background:#fff8df;border:1px solid #e0c56a;color:#765d00;padding:12px;border-radius:10px;margin-top:10px}.save-panel{background:#f7faf3;border:1px solid #cbd8c1;padding:12px;border-radius:10px;margin-top:12px}.category-note{background:#fff8df;border:1px solid #e0c56a;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}.category-ok{background:#e9f7ea;border:1px solid #8bc58f;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}@media(max-width:800px){.grid,.promo-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><b style="font-size:25px;letter-spacing:3px">NUTRILIFE</b><br>Panel de administración</header>
<main id="app"></main>
<script>
const app=document.getElementById('app');
let P=[],C={},pass='';

function login(){app.innerHTML='<div class="box login"><h2>Acceso administrador</h2><p class="muted">Ingresá la contraseña del panel.</p><input id="pw" type="password" placeholder="Contraseña"><br><br><button class="p" onclick="doLogin()">ENTRAR</button><p id="msg"></p></div>'}

function categoryKey(s){return String(s??'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\\s+/g,' ')}
function categoryName(s){return String(s??'').trim()}

function normalizeCategories(d){
  const saved=Array.isArray(d.config?.categories)?d.config.categories:[];
  const map=new Map();
  for(const x of saved){
    const name=categoryName(x?.name);if(!name)continue;
    const key=categoryKey(name);
    if(!map.has(key))map.set(key,{name,image:x.image||null,active:x.active!==false});
    else if(!map.get(key).image&&x.image)map.get(key).image=x.image;
  }
  for(const p of d.products||[]){
    const raw=categoryName(p.cat)||'Otros';
    const key=categoryKey(raw);
    if(!map.has(key))map.set(key,{name:raw,image:null,active:true});
  }
  const categories=[...map.values()];
  const byKey=new Map(categories.map(c=>[categoryKey(c.name),c.name]));
  for(const p of P){const raw=categoryName(p.cat)||'Otros';p.cat=byKey.get(categoryKey(raw))||raw}
  return categories;
}

async function doLogin(){
  pass=pw.value;
  try{
    const r=await fetch('/api/admin/catalog',{headers:{'x-admin-password':pass}});if(!r.ok)throw 0;
    const d=await r.json();P=d.products||[];C=d.config||{};C.promotions=C.promotions||[];C.categories=normalizeCategories(d);draw();
  }catch(e){msg.className='err';msg.textContent='Contraseña incorrecta.'}
}

function legacyPrice(p,g){return Math.round(Number(p.cost||0)*g/1000*(1+Number(p['margin'+g]??p.margin??40)/100))}
function isSpice(p){return /especias|condimentos/i.test(String(p.cat||''))}
function price(p,g){const key='price'+g;return p[key]!=null&&p[key]!==''?Number(p[key]):legacyPrice(p,g)}
function sizeConfig(p){return isSpice(p)?[{g:50,l:'50 g',key:'price50'},{g:200,l:'200 g',key:'price200'},{g:1000,l:'1 kg',key:'price1000'}]:[{g:100,l:'100 g',key:'price100'},{g:500,l:'500 g',key:'price500'},{g:1000,l:'1 kg',key:'price1000'}]}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function categoryOptions(selected){
  const active=C.categories||[];
  if(!active.length)return '<option value="">⚠️ Primero creá una categoría</option>';
  return '<option value="">Seleccioná una categoría...</option>'+active.map(c=>`<option value="${esc(c.name)}" ${categoryKey(c.name)===categoryKey(selected)?'selected':''}>${esc(c.name)}</option>`).join('');
}

function draw(){
app.innerHTML=`
<div class="box"><h2>💰 Precios por presentación</h2><p class="muted">Definí directamente el precio de venta de cada producto. Productos normales: 100 g, 500 g y 1 kg. <b>Especias / Condimentos: 50 g, 200 g y 1 kg.</b> Los demás datos se mantienen sin cambios.</p><div class="actions"><button id="saveBtn" class="p" onclick="save()">💾 GUARDAR TODO</button><button onclick="sync()">🔄 ACTUALIZAR COSTOS DESDE MAYAH</button><button onclick="logout()">Salir</button></div><div class="save-panel"><b>ESTADO DEL GUARDADO</b><div id="status" class="save-wait">🔴 Aún no se ha confirmado ningún guardado en esta sesión.</div><div id="lastSaved" class="muted" style="margin-top:8px">Último guardado confirmado: —</div></div></div>

<div class="box"><h2>🖼️ Categorías de la tienda</h2><p class="muted">Estas son las categorías que reconoce NUTRILIFE. Los productos existentes se normalizan automáticamente: diferencias de mayúsculas, acentos, espacios o guiones no crean categorías duplicadas.</p><div class="newprod"><div class="grid"><label>Nombre de la nueva categoría<input id="newcatname" placeholder="Ej. Frutos Secos"></label><label>Imagen<input id="newcatimage" type="file" accept="image/*"></label><label>Visible<select id="newcatactive"><option value="true">Sí</option><option value="false">No</option></select></label></div><br><button class="p" onclick="addCategory()">➕ AGREGAR CATEGORÍA</button><p id="catmsg" class="muted"></p></div><div id="catlist"></div></div>

<div class="box"><div class="newprod"><h3>➕ Agregar un producto nuevo</h3><p class="muted">La categoría ya no se escribe manualmente. Elegí una categoría existente. Si no aparece, primero creala arriba.</p><div id="newCategoryWarning" class="category-note" style="display:none">⚠️ No hay categorías disponibles. Creá al menos una categoría antes de cargar productos.</div><div class="grid"><label>Código<input id="newcode" placeholder="Ej. 1501"></label><label>Producto<input id="newname" placeholder="Ej. Nueces Mariposa"></label><label>Categoría<select id="newcat" onchange="updateNewPriceLabels()">${categoryOptions('')}</select></label><label>Costo por kg<input id="newcost" type="number"></label><label><span id="newp1label">Precio presentación 1</span><input id="newp1" type="number" min="0" placeholder="Según categoría"></label><label><span id="newp2label">Precio presentación 2</span><input id="newp2" type="number" min="0" placeholder="Según categoría"></label><label>Precio 1 kg<input id="newp1000" type="number" min="0" placeholder="Ej. 20000"></label><label>Descripción<input id="newdesc"></label><label>Foto<input id="newphoto" type="file" accept="image/*"></label><label>Disponible<select id="newavailable"><option value="true">Sí</option><option value="false">No</option></select></label></div><br><button id="addProductBtn" class="p" onclick="addProduct()">➕ AGREGAR A LA LISTA</button><p id="addmsg" class="muted"></p></div></div>

<div class="box"><h2>🔥 Promociones</h2><p class="muted">Creá combos, descuentos o precios especiales. Las promos activas aparecerán automáticamente en la página principal.</p><div class="newprod"><div class="promo-grid"><label>Nombre de la promo<input id="pn" placeholder="Ej. Combo Energía"></label><label>Precio promo<input id="pp" type="number" placeholder="Ej. 6990"></label><label>Texto corto<input id="pd" placeholder="Ej. 3 productos para compartir"></label><label>Foto<input id="pi" type="file" accept="image/*"></label><label>Activa<select id="pa"><option value="true">Sí</option><option value="false">No</option></select></label><label>Etiqueta<input id="pt" placeholder="🔥 OFERTA"></label></div><br><button class="p" onclick="addPromo()">➕ AGREGAR PROMO</button><p id="promsg" class="muted"></p></div><div id="promolist"></div></div>

<div class="box"><h2>Productos</h2><p class="muted">La categoría de cada producto se selecciona de la lista de categorías. Los productos que ya existían conservan su categoría y se corrigen automáticamente si solo tenían diferencias de formato.</p><div class="scroll"><table><thead><tr><th>Foto</th><th>Producto</th><th>Categoría</th><th>Costo/kg</th><th>Presentación 1<br><span class="margin-head">Precio de venta</span></th><th>Presentación 2<br><span class="margin-head">Precio de venta</span></th><th>1 kg<br><span class="margin-head">Precio de venta</span></th><th>Disponible</th><th>Nueva foto</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;
	drawRows();drawCategories();drawPromos();restoreLastSave();
}

function restoreLastSave(){const t=localStorage.getItem('nutrilife_last_confirmed_save');if(t)lastSaved.textContent='Último guardado confirmado: '+t}

function drawCategories(){
  catlist.innerHTML=(C.categories||[]).map((c,i)=>{
    const used=P.filter(p=>categoryKey(p.cat)===categoryKey(c.name)).length;
    return `<div class="cat-card"><div class="grid"><label>Nombre<input value="${esc(c.name)}" onchange="renameCategory(${i},this.value)"></label><label>Productos asignados<input value="${used}" readonly></label><label>Visible<select onchange="C.categories[${i}].active=this.value==='true'"><option value="true" ${c.active!==false?'selected':''}>Sí</option><option value="false" ${c.active===false?'selected':''}>No</option></select></label><label>Nueva imagen<input type="file" accept="image/*" onchange="categoryPhoto(event,${i})"></label></div>${c.image?`<img class="cat-thumb" src="${c.image}" alt="${esc(c.name)}">`:'<p class="mini">Sin imagen: se mostrará una imagen genérica.</p>'}${used?`<div class="category-ok">✓ Esta categoría ya está asignada a ${used} producto${used===1?'':'s'}.</div>`:''}<br><button class="danger" onclick="deleteCategory(${i})">Eliminar categoría</button></div>`;
  }).join('')||'<p class="muted">No hay categorías configuradas.</p>';
}

function renameCategory(i,value){
  const name=categoryName(value);
  if(!name){drawCategories();return alert('La categoría no puede quedar vacía.')}
  const old=C.categories[i].name;
  if(C.categories.some((c,j)=>j!==i&&categoryKey(c.name)===categoryKey(name)))return alert('Ya existe una categoría equivalente con ese nombre.');
  C.categories[i].name=name;
  P.forEach(p=>{if(categoryKey(p.cat)===categoryKey(old))p.cat=name});
  drawCategories();drawRows();
}

function deleteCategory(i){
  const c=C.categories[i],used=P.filter(p=>categoryKey(p.cat)===categoryKey(c.name)).length;
  if(used)return alert(`No se puede eliminar "${c.name}" porque tiene ${used} producto${used===1?' asignado':'s asignados'}. Reasigná esos productos primero.`);
  if(!confirm(`¿Eliminar la categoría "${c.name}"?`))return;
  C.categories.splice(i,1);drawCategories();drawRows();
}

function categoryPhoto(e,i){let f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024)return alert('La foto debe pesar menos de 4 MB.');let r=new FileReader();r.onload=()=>{C.categories[i].image=r.result;drawCategories()};r.readAsDataURL(f)}

function addCategory(){
  const name=categoryName(newcatname.value),active=newcatactive.value==='true',f=newcatimage.files[0];
  if(!name)return catmsg.textContent='Escribí el nombre de la categoría.';
  if(C.categories.some(c=>categoryKey(c.name)===categoryKey(name)))return catmsg.textContent='Esa categoría ya existe o es equivalente a una existente.';
  if(f&&f.size>4*1024*1024)return alert('La foto debe pesar menos de 4 MB.');
  const finish=image=>{C.categories.push({name,image,active});newcatname.value='';newcatimage.value='';drawCategories();refreshNewCategorySelect();catmsg.className='ok';catmsg.textContent='✓ Categoría agregada. Ahora ya puede seleccionarse al cargar productos. Presioná GUARDAR TODO.'};
  if(f){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(null)
}

function refreshNewCategorySelect(){
  const s=document.getElementById('newcat');if(!s)return;const old=s.value;s.innerHTML=categoryOptions(old);const warn=document.getElementById('newCategoryWarning');const btn=document.getElementById('addProductBtn');if(warn)warn.style.display=C.categories.length?'none':'block';if(btn)btn.disabled=!C.categories.length;updateNewPriceLabels();
}
function updateNewPriceLabels(){
  const spice=/especias|condimentos/i.test(String(categoryName(document.getElementById('newcat')?.value)||''));
  const a=document.getElementById('newp1label'),b=document.getElementById('newp2label');
  if(a)a.textContent=spice?'Precio 50 g':'Precio 100 g';
  if(b)b.textContent=spice?'Precio 200 g':'Precio 500 g';
}

function drawRows(){
  rows.innerHTML=P.map((p,i)=>{
    const sizes=sizeConfig(p);
    const oldPrices=isSpice(p)&&((p.price100!=null&&p.price100!=='')||(p.price500!=null&&p.price500!==''));
    const oldNote=oldPrices&&sizes.length===3?'<div class="mini">Precios anteriores conservados: '+(p.price100!=null&&p.price100!==''?'100 g $'+Number(p.price100).toLocaleString('es-AR'):'')+(p.price100!=null&&p.price100!==''&&p.price500!=null&&p.price500!==''?' · ':'')+(p.price500!=null&&p.price500!==''?'500 g $'+Number(p.price500).toLocaleString('es-AR'):'')+'</div>':'';
    return '<tr><td>'+(p.image?'<img class="thumb" src="'+p.image+'">':'—')+'</td><td><input value="'+esc(p.name)+'" onchange="P['+i+'].name=this.value"></td><td><select onchange="setProductCategory('+i+',this.value)">'+categoryOptions(p.cat)+'</select></td><td><input type="number" value="'+(p.cost??0)+'" onchange="P['+i+'].cost=+this.value;drawRows()"></td>'+sizes.map(x=>'<td><input style="width:100px" type="number" min="0" value="'+(p[x.key]!=null?p[x.key]:'')+'" placeholder="'+x.l+'" onchange="P['+i+'].'+x.key+'=+this.value">'+(isSpice(p)&&x.g===1000?oldNote:'')+'</td>').join('')+'<td><input type="checkbox" '+(p.available!==false?'checked':'')+' onchange="P['+i+'].available=this.checked"></td><td><input type="file" accept="image/*" onchange="photo(event,'+i+')"></td></tr>'
  }).join('');
  refreshNewCategorySelect();
}
function setProductCategory(i,value){if(!value)return;const c=C.categories.find(x=>categoryKey(x.name)===categoryKey(value));if(c)P[i].cat=c.name;drawRows()}
function photo(e,i){let f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024)return alert('La foto debe pesar menos de 4 MB.');let r=new FileReader();r.onload=()=>{P[i].image=r.result;drawRows()};r.readAsDataURL(f)}

function addProduct(){
  const name=newname.value.trim(),cat=categoryName(newcat.value),cost=Number(newcost.value),p1=Number(newp1.value),p2=Number(newp2.value),p1000=Number(newp1000.value),code=newcode.value.trim()||('LOCAL-'+Date.now());
  if(!name)return addmsg.textContent='Escribí el nombre.';
  if(!C.categories.length)return addmsg.textContent='Primero creá una categoría arriba.';
  if(!cat)return addmsg.textContent='Seleccioná una categoría.';
  if(cost<0)return addmsg.textContent='Costo inválido.';
  if(!Number.isFinite(p1)||p1<0||!Number.isFinite(p2)||p2<0||!Number.isFinite(p1000)||p1000<0)return addmsg.textContent='Completá los tres precios de venta.';
  if(P.some(p=>String(p.code)===String(code)))return addmsg.textContent='Ese código ya existe.';
  const category=C.categories.find(c=>categoryKey(c.name)===categoryKey(cat));if(!category)return addmsg.textContent='La categoría seleccionada no existe. Creala o seleccioná una de la lista.';
  const f=newphoto.files[0],finish=image=>{const spice=/especias|condimentos/i.test(category.name);P.push({code,name,cat:category.name,cost,...(spice?{price50:p1,price200:p2}:{price100:p1,price500:p2}),price1000:p1000,desc:newdesc.value.trim(),available:newavailable.value==='true',image});drawRows();addmsg.className='ok';addmsg.textContent='✓ Agregado con categoría y precios definidos. Presioná GUARDAR TODO.'};
  if(f){if(f.size>4*1024*1024)return alert('La foto debe pesar menos de 4 MB.');let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(null)
}

function addPromo(){const name=pn.value.trim(),priceValue=Number(pp.value),desc=pd.value.trim(),tag=pt.value.trim()||'🔥 PROMO',active=pa.value==='true',f=pi.files[0];if(!name||!priceValue)return promsg.textContent='Completá nombre y precio.';if(f&&f.size>4*1024*1024)return alert('La foto debe pesar menos de 4 MB.');const finish=image=>{C.promotions.push({id:'PROMO-'+Date.now(),name,price:priceValue,desc,tag,active,image});pn.value='';pp.value='';pd.value='';pt.value='';pi.value='';drawPromos();promsg.className='ok';promsg.textContent='✓ Promo agregada. Presioná GUARDAR TODO.'};if(f){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(null)}
function promoPhoto(e,i){let f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024)return alert('La foto debe pesar menos de 4 MB.');let r=new FileReader();r.onload=()=>{C.promotions[i].image=r.result;drawPromos()};r.readAsDataURL(f)}
function drawPromos(){if(!promolist)return;promolist.innerHTML=C.promotions.map((p,i)=>`<div class="promo-card"><div class="grid"><label>Nombre<input value="${esc(p.name)}" onchange="C.promotions[${i}].name=this.value"></label><label>Precio<input type="number" value="${p.price}" onchange="C.promotions[${i}].price=+this.value"></label><label>Texto<input value="${esc(p.desc)}" onchange="C.promotions[${i}].desc=this.value"></label><label>Etiqueta<input value="${esc(p.tag)}" onchange="C.promotions[${i}].tag=this.value"></label><label>Activa<select onchange="C.promotions[${i}].active=this.value==='true'"><option value="true" ${p.active?'selected':''}>Sí</option><option value="false" ${!p.active?'selected':''}>No</option></select></label><label>Foto nueva<input type="file" accept="image/*" onchange="promoPhoto(event,${i})"></label></div>${p.image?`<img class="promo-thumb" src="${p.image}">`:'<p class="mini">Sin foto</p>'}<button class="danger" onclick="C.promotions.splice(${i},1);drawPromos()">Eliminar</button></div>`).join('')||'<p class="muted">Todavía no hay promociones.</p>'}

async function save(){
 const statusEl=document.getElementById('status'),lastEl=document.getElementById('lastSaved'),btn=document.getElementById('saveBtn');
 statusEl.className='save-wait';statusEl.innerHTML='🟡 <b>GUARDANDO CAMBIOS...</b><br>Enviando el catálogo al servidor. No cierres esta página.';btn.disabled=true;btn.textContent='⏳ GUARDANDO...';
 try{
  const expectedProducts=JSON.stringify(P),expectedPromos=JSON.stringify(C.promotions||[]),expectedCategories=JSON.stringify(C.categories||[]);
  let r=await fetch('/api/admin/catalog',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-password':pass},body:JSON.stringify({products:P,config:C})});
  let j=await r.json();if(!r.ok)throw new Error(j.message||'El servidor rechazó el guardado.');
  statusEl.innerHTML='🟡 <b>GUARDADO RECIBIDO. VERIFICANDO...</b><br>Volviendo a leer los datos del servidor.';
  let check=await fetch('/api/admin/catalog?verify='+Date.now(),{headers:{'x-admin-password':pass},cache:'no-store'});if(!check.ok)throw new Error('Se guardó, pero no pudimos verificar la lectura posterior.');
  let saved=await check.json();
  if(JSON.stringify(saved.products||[])!==expectedProducts||JSON.stringify((saved.config||{}).promotions||[])!==expectedPromos||JSON.stringify((saved.config||{}).categories||[])!==expectedCategories)throw new Error('Los datos recuperados no coinciden con lo que acabás de guardar.');
  const now=new Date().toLocaleString('es-AR');statusEl.className='save-ok';statusEl.innerHTML='🟢 <b>CAMBIOS GUARDADOS Y VERIFICADOS</b><br>Productos, imágenes, precios, márgenes, disponibilidad, categorías y promociones quedaron confirmados en el servidor.<br><span class="muted">Última verificación: '+now+'</span>';lastEl.textContent='Último guardado confirmado: '+now;localStorage.setItem('nutrilife_last_confirmed_save',now)
 }catch(e){statusEl.className='save-err';statusEl.innerHTML='🔴 <b>NO SE PUDO CONFIRMAR EL GUARDADO</b><br>'+esc(e.message)+'<br><span class="muted">No cierres la página. Volvé a intentar GUARDAR TODO.</span>'}
 finally{btn.disabled=false;btn.textContent='💾 GUARDAR TODO'}
}

async function sync(){const statusEl=document.getElementById('status');statusEl.textContent='Consultando Mayah...';try{let r=await fetch('/api/admin/sync-mayah',{method:'POST',headers:{'x-admin-password':pass}});let j=await r.json();if(!r.ok)throw new Error(j.message);let d=await(await fetch('/api/admin/catalog',{headers:{'x-admin-password':pass}})).json();P=d.products||[];C=d.config||{};C.promotions=C.promotions||[];C.categories=normalizeCategories(d);draw();statusEl.className='ok';statusEl.textContent='✓ Costos actualizados desde Mayah: '+j.changed+' productos.'}catch(e){statusEl.className='err';statusEl.textContent='No se pudo actualizar: '+e.message}}
function logout(){pass='';login()}
login();
</script>
</body>
</html>
