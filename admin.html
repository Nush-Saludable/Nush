<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUTRILIFE Admin</title>
<style>body{font-family:Arial;margin:0;background:#f5f3ed;color:#263025}header{background:#40512f;color:#fff;padding:25px}main{max-width:1200px;margin:auto;padding:20px}.box{background:#fff;border-radius:15px;padding:20px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input{padding:9px;width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}button{padding:10px 15px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.p{background:#40512f;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.scroll{overflow:auto}</style></head>
<body><header><b style="font-size:25px;letter-spacing:3px">NUTRILIFE</b><br>Panel de administración</header><main>
<div class="box"><h2>Configuración de precios</h2><div class="grid">
<label>Margen general %<input id="margin" type="number" value="40"></label><label>Packaging 100 g<input id="p100" type="number" value="100"></label>
<label>Packaging 500 g<input id="p500" type="number" value="180"></label><label>Packaging 1 kg<input id="p1000" type="number" value="250"></label></div>
<p><button class="p" onclick="save()">GUARDAR CONFIGURACIÓN</button></p></div>
<div class="box"><h2>Productos y fotos</h2><p>Podés cargar una foto propia cuando Mayah no tenga imagen.</p><div class="scroll"><table><thead><tr><th>Producto</th><th>Costo</th><th>Margen %</th><th>Foto</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main><script>
let P=[],C={};async function init(){P=await(await fetch("products.json")).json();C=await(await fetch("config.json")).json();margin.value=C.margin;p100.value=C.packaging[100];p500.value=C.packaging[500];p1000.value=C.packaging[1000];draw()}
const money=n=>"$"+Math.round(n).toLocaleString("es-AR");
function draw(){rows.innerHTML=P.map((p,i)=>`<tr><td>${p.name}</td><td>${money(p.cost)}</td><td><input style="width:70px" type="number" value="${p.margin||C.margin}" onchange="P[${i}].margin=+this.value"></td><td><input type="file" accept="image/*" onchange="photo(event,${i})">${p.image?" ✓ foto cargada":""}</td></tr>`).join("")}
function photo(e,i){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{P[i].image=r.result;draw()};r.readAsDataURL(f)}
function save(){C.margin=+margin.value;C.packaging={100:+p100.value,500:+p500.value,1000:+p1000.value};localStorage.setItem("nutrilifeAdmin",JSON.stringify({P,C}));alert("Guardado en este navegador. Para producción hay que conectar un backend.")}
init();
</script></body></html>
