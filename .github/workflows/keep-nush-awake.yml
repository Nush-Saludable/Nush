name: Verificar tienda Nush

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comprobar que GitHub Pages responde
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://benja20br-source.github.io/Nush/ -o /dev/null
