name: Deploy Nush API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-nush-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUSH_GITHUB_TOKEN: ${{ secrets.NUSH_GITHUB_TOKEN }}
          NUSH_ADMIN_PASSWORD: ${{ secrets.NUSH_ADMIN_PASSWORD }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NUSH_GITHUB_TOKEN NUSH_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Deploy Worker and configure runtime secrets
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUSH_GITHUB_TOKEN: ${{ secrets.NUSH_GITHUB_TOKEN }}
          NUSH_ADMIN_PASSWORD: ${{ secrets.NUSH_ADMIN_PASSWORD }}
        run: |
          npx wrangler deploy
          printf '%s' "$NUSH_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          printf '%s' "$NUSH_ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
