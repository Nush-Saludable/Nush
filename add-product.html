<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUTRILIFE · Agregar producto</title><style>body{font-family:Arial;background:#f5f3ed;color:#263025;margin:0}.box{max-width:650px;margin:30px auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 2px 12px #0001}input,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 14px;border:1px solid #ddd;border-radius:8px}button{padding:12px 18px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.p{background:#40512f;color:#fff}.muted{color:#777;font-size:13px}.ok{color:#236b2a;font-weight:bold}.err{color:#a22;font-weight:bold}.preview{max-width:180px;max-height:180px;border-radius:10px;display:block;margin:8px 0}</style></head><body><div class="box"><h1>NUTRILIFE</h1><h2>➕ Agregar producto</h2><p class="muted">Completá los datos y el producto quedará disponible en la tienda.</p><label>Contraseña administrador<input id="pw" type="password" placeholder="Contraseña"></label><label>Código del producto<input id="code" placeholder="Ej: 1400"></label><label>Nombre<input id="name" placeholder="Ej: Nueces Mariposa"></label><label>Categoría<select id="cat"><option>Frutos Secos</option><option>Granos</option><option>Harinas</option><option>Legumbres</option><option>Semillas</option><option>Otros</option></select></label><label>Costo por kg<input id="cost" type="number" min="0" step="1" placeholder="Ej: 5000"></label><label>Margen %<input id="margin" type="number" min="0" step="1" value="40"></label><label>Descripción<input id="desc" placeholder="Producto NUTRILIFE"></label><label>Foto del producto<input id="photo" type="file" accept="image/*" onchange="previewPhoto(event)"></label><img id="preview" class="preview" style="display:none"><button class="p" onclick="add()">GUARDAR PRODUCTO</button><p id="msg"></p></div><script>function previewPhoto(e){let f=e.target.files[0];if(!f)return;if(f.size>4*1024*1024){alert('La foto debe pesar menos de 4 MB.');e.target.value='';return}let r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block'};r.readAsDataURL(f)}async function add(){msg.className='muted';msg.textContent='Guardando...';let pass=pw.value,n=String(name.value).trim(),c=String(code.value).trim(),co=Number(cost.value),m=Number(margin.value);if(!pass||!n||!c||!Number.isFinite(co)){msg.className='err';msg.textContent='Completá contraseña, código, nombre y costo.';return}try{let r=await fetch('/api/admin/catalog',{headers:{'x-admin-password':pass}});if(!r.ok)throw new Error('Contraseña incorrecta');let d=await r.json();if(d.products.some(p=>String(p.code)===c))throw new Error('Ese código ya existe. Usá otro.');let image=null,f=photo.files[0];if(f){let rr=new FileReader();image=await new Promise((res,rej)=>{rr.onload=()=>res(rr.result);rr.onerror=rej;rr.readAsDataURL(f)})}d.products.push({code:c,name:n,cat:cat.value,cost:co,margin:m,available:true,desc:desc.value||'Producto NUTRILIFE',image});let save=await fetch('/api/admin/catalog',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-password':pass},body:JSON.stringify({products:d.products,config:d.config})});let j=await save.json();if(!save.ok)throw new Error(j.message||'No se pudo guardar');msg.className='ok';msg.textContent='✓ Producto agregado correctamente. Ya podés verlo en la tienda.';code.value='';name.value='';cost.value='';desc.value='';photo.value='';preview.style.display='none'}catch(e){msg.className='err';msg.textContent='Error: '+e.message}}</script></body></html>
